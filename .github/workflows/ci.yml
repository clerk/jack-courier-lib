name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_MODULES_TOKEN: ${{ secrets.GO_MODULES_TOKEN }}

jobs:
  vet:
    name: Vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure private Go modules
        run: |
          if [ -n "${GO_MODULES_TOKEN:-}" ]; then
            git config --global url."https://x-access-token:${GO_MODULES_TOKEN}@github.com/clerk/".insteadOf "https://github.com/clerk/"
            echo "GOPRIVATE=github.com/clerk/*" >> "$GITHUB_ENV"
          else
            echo "::warning::GO_MODULES_TOKEN is unset; skipping private Go module configuration. Private clerk modules may fail to resolve."
          fi
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure private Go modules
        run: |
          if [ -n "${GO_MODULES_TOKEN:-}" ]; then
            git config --global url."https://x-access-token:${GO_MODULES_TOKEN}@github.com/clerk/".insteadOf "https://github.com/clerk/"
            echo "GOPRIVATE=github.com/clerk/*" >> "$GITHUB_ENV"
          else
            echo "::warning::GO_MODULES_TOKEN is unset; skipping private Go module configuration. Private clerk modules may fail to resolve."
          fi
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure private Go modules
        run: |
          if [ -n "${GO_MODULES_TOKEN:-}" ]; then
            git config --global url."https://x-access-token:${GO_MODULES_TOKEN}@github.com/clerk/".insteadOf "https://github.com/clerk/"
            echo "GOPRIVATE=github.com/clerk/*" >> "$GITHUB_ENV"
          else
            echo "::warning::GO_MODULES_TOKEN is unset; skipping private Go module configuration. Private clerk modules may fail to resolve."
          fi
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make test
